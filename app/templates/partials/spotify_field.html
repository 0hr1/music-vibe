{#- Spotify link input. With `auto`, it looks the link up as soon as it loads. -#}
<div class="field" id="spotify-field"
     {%- if auto %} data-spotify-auto hx-get="/albums/spotify" hx-trigger="load" hx-target="this" hx-swap="outerHTML"
     hx-include="[name=title],[name=creator],[name=spotify_url]"{% endif %}>
  <span>Spotify link</span>
  <div class="row">
    <input name="spotify_url" type="url" value="{{ v_spotify or '' }}" aria-label="Spotify link"
           placeholder="https://open.spotify.com/album/…">
    {% if spotify_enabled %}
    <button class="btn" type="button" hx-get="/albums/spotify" hx-target="#spotify-field" hx-swap="outerHTML"
            hx-include="[name=title],[name=creator],[name=spotify_url]">Find</button>
    {% endif %}
  </div>
  {% if auto %}<small class="muted">Looking on Spotify<span class="dots"></span></small>
  {% elif spotify_note %}<small class="muted">{{ spotify_note }}</small>{% endif %}
</div>
