<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a1146">
  <title>{% block title %}music vibe{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💿</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  {% if user %}
  <header class="taskbar">
    <a class="start-btn" href="/" aria-label="music vibe"><span aria-hidden="true">💿</span><span class="start-label">music vibe</span></a>
    <nav class="taskbar-nav">
      <a class="task {% if request.url.path == '/' %}active{% endif %}" href="/">Library</a>
      <a class="task {% if request.url.path == '/albums/new' %}active{% endif %}" href="/albums/new">+ Add</a>
      <a class="task {% if request.url.path == '/vibes' %}active{% endif %}" href="/vibes">Vibes</a>
      <a class="task {% if request.url.path == '/stats' %}active{% endif %}" href="/stats">Stats</a>
    </nav>
    <div class="tray">
      <a class="tray-user {% if request.url.path == '/account' %}active{% endif %}" href="/account" title="Account"><span aria-hidden="true">👤</span><span class="tray-name">{{ user.username }}</span></a>
      <form method="post" action="/logout"><button class="tray-btn" type="submit">Log out</button></form>
    </div>
  </header>
  {% endif %}
  <main class="desktop">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
